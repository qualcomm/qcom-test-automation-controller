# QTAC Claude PR Review Agent — with Token-Budget Batching & Learning

name: QTAC PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Pre-process the PR diff ────────────────────────────────────────
  pre-process:
    name: Analyze PR Scope & Build Batches
    runs-on: ubuntu-latest
    # Best-effort: the AI review needs a credential reachable from cloud runners.
    # Until one is provisioned, never block the PR on this workflow.
    continue-on-error: true

    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip-review]') }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      total_batches: ${{ steps.scope.outputs.total_batches }}
      is_large_pr: ${{ steps.scope.outputs.is_large_pr }}
      batch_matrix: ${{ steps.scope.outputs.batch_matrix }}
      was_capped: ${{ steps.scope.outputs.was_capped }}
      dropped_file_count: ${{ steps.scope.outputs.dropped_file_count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run PR Scope Analyzer
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python3 .github/scripts/pr_scope_analyzer.py

          # Read outputs from pr_batches.json
          TOTAL=$(python3 -c "import json; d=json.load(open('pr_batches.json')); print(d['total_batches'])")
          LARGE=$(python3 -c "import json; d=json.load(open('pr_batches.json')); print(str(d['is_large_pr']).lower())")
          CAPPED=$(python3 -c "import json; d=json.load(open('pr_batches.json')); print(str(d.get('was_capped', False)).lower())")
          DROPPED=$(python3 -c "import json; d=json.load(open('pr_batches.json')); print(d.get('dropped_file_count', 0))")

          # Build matrix JSON: ["1","2","3"] etc.
          MATRIX=$(python3 -c "
          import json
          d = json.load(open('pr_batches.json'))
          nums = [str(i+1) for i in range(d['total_batches'])]
          print(json.dumps(nums))
          ")

          echo "total_batches=$TOTAL" >> $GITHUB_OUTPUT
          echo "is_large_pr=$LARGE" >> $GITHUB_OUTPUT
          echo "batch_matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "was_capped=$CAPPED" >> $GITHUB_OUTPUT
          echo "dropped_file_count=$DROPPED" >> $GITHUB_OUTPUT

          echo "=== Scope Analysis Complete ==="
          cat pr_scope_meta.txt
          echo ""
          echo "Batches: $TOTAL | Large PR: $LARGE"
          echo "Matrix: $MATRIX"

      - name: Upload Batch Files
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-batches-${{ github.run_number }}
          path: |
            pr_batch_*.txt
            pr_batches.json
          retention-days: 7

  # ── Step 2: Review each batch with Claude ──────────────────────────────────
  review:
    name: Claude Review — Batch ${{ matrix.batch }}
    needs: pre-process
    runs-on: ubuntu-latest
    continue-on-error: true   # best-effort; never block the PR (see pre-process)

    # Run one job per batch (matrix from pre-process step)
    strategy:
      fail-fast: false
      max-parallel: 3   # max 3 concurrent Claude calls
      matrix:
        batch: ${{ fromJson(needs.pre-process.outputs.batch_matrix) }}

    permissions:
      contents: read
      pull-requests: write
      id-token: write        # required by anthropics/claude-code-action (OIDC)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Download Batch Files
        uses: actions/download-artifact@v4
        with:
          name: pr-review-batches-${{ github.run_number }}

      - name: Verify Batch File Exists
        id: check
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          BATCH_FILE="pr_batch_${BATCH}.txt"
          if [ -f "$BATCH_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            LINES=$(wc -l < "$BATCH_FILE")
            echo "Batch ${BATCH}: $LINES lines"
            head -5 "$BATCH_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Batch file $BATCH_FILE not found — skipping"
          fi

      # ── Agent 1 — REVIEWER: drafts findings to JSON, posts NOTHING ──────────
      - name: Reviewer — Draft Findings (Batch ${{ matrix.batch }})
        if: steps.check.outputs.exists == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pass a token explicitly so the action does NOT try to mint an OIDC
          # token (OIDC is unavailable on fork PRs and requires id-token: write).
          github_token: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            You are a senior C++/Qt developer performing a code review for the
            QTAC (Qualcomm Test Automation Controller) repository. In this step you
            ONLY draft findings — you do NOT post anything to the PR.

            **STEP 1 — Read codebase context:**
            Read `SKILLS.md` in the repository root:
            - Established patterns that must NOT be flagged (pre-existing style)
            - Architecture overview and file skip list

            **STEP 2 — Read the pre-computed review context for this batch:**
            Read `pr_batch_${{ matrix.batch }}.txt` in the current directory. It contains:
            - The PR INTENT (author's title + description) — context to avoid flagging
              deliberate changes; it is NOT a checklist
            - The compressed diff, per-file-type checklists, learned false positives,
              learned recurring issues, and large-PR instructions

            **STEP 3 — Review:**
            - Apply ONLY the checklist items for each file type in the batch file
            - Review ONLY the diff lines shown (+ added, - removed)
            - Do NOT flag patterns in SKILLS.md "Established Patterns" or the batch's
              "LEARNED FALSE POSITIVES" section
            - If this is a large-PR batch, restrict to Critical/Warning
            - Trace call chains within the batch (null-return propagation,
              use-after-free across a helper, ownership/leak). For findings that
              depend on context NOT in this batch, set "grounded": false.

            **STEP 4 — Write findings to a file (do NOT post to the PR):**
            Write your findings as JSON to `findings_batch_${{ matrix.batch }}.json`
            in the current directory, with EXACTLY this shape:
            {
              "batch": "${{ matrix.batch }}",
              "verdict": "approve | changes_requested | comment",
              "summary": "one-line description of what this batch does",
              "good_practices": ["..."],
              "findings": [
                {
                  "severity": "critical | warning | info",
                  "file": "path/as/shown/in/the/diff",
                  "line": 123,
                  "code": "short-slug e.g. null-deref",
                  "message": "the issue and the fix",
                  "grounded": true,
                  "evidence": "the exact diff line(s) that prove this finding"
                }
              ]
            }
            Do NOT use gh or any comment tool. Only write the JSON file.

          claude_args: >-
            --allowedTools
            "Bash(cat:*),Bash(git diff:*),Write"

      # ── Agent 2 — VERIFIER: checks each finding, posts only survivors ───────
      - name: Verifier — Check & Post (Batch ${{ matrix.batch }})
        if: steps.check.outputs.exists == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Explicit token → skip OIDC (see reviewer step). This token also posts
          # the PR comments.
          github_token: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            You are a SKEPTICAL senior reviewer verifying another agent's draft
            findings before they are posted to a PR. Your job is to prevent
            incorrect or hallucinated comments from reaching the author.

            **Inputs (read all three):**
            1. `SKILLS.md` — established patterns that must NOT be flagged
            2. `pr_batch_${{ matrix.batch }}.txt` — the GROUND TRUTH (PR intent + diff + checklists)
            3. `findings_batch_${{ matrix.batch }}.json` — the reviewer's draft findings
               (if this file is missing or empty, treat it as an empty finding list)

            **Verify EACH draft finding against the diff in the batch file:**
            - DROP the finding if ANY of these are true:
              • the cited file/line does not exist in the diff, or the diff line does
                not actually say what the finding claims (hallucination / misread)
              • it matches an "Established Pattern" in SKILLS.md or a "LEARNED FALSE
                POSITIVE" in the batch file
              • it is not a real, actionable issue (pure noise / style bikeshedding)
            - KEEP the finding as-is if you can CONFIRM it directly from the diff.
              Downgrade its severity if the reviewer over-stated it.
            - KEEP but mark UNVERIFIED (prefix the message with "⚠️ unverified: ")
              if it is plausible but you cannot fully confirm it from the diff
              (e.g. depends on code not in this batch, or "grounded": false).
            Be conservative: never invent line numbers or code you cannot see.

            **Post results:**
            Batch ${{ matrix.batch }} of ${{ needs.pre-process.outputs.total_batches }}
            PR: ${{ github.event.pull_request.number || inputs.pr_number }} · Repo: ${{ github.repository }}

            1. Summary comment via `gh pr comment`:
               - Header: "## 🤖 QTAC Code Review — Batch ${{ matrix.batch }}/${{ needs.pre-process.outputs.total_batches }}"
               - Verdict (✅ Approve / ⚠️ Changes Requested / 💬 Comment)
               - Confirmed issues by severity (🔴 Critical, 🟡 Warning, 🔵 Info),
                 with unverified ones clearly marked
               - A line: "Verification: kept X, dropped Y draft finding(s)."
               - This EXACT disclaimer as the LAST line (verbatim):
                 "> 🤖 _Generated by an AI review agent (reviewer + verifier) — findings may still be incorrect. Treat as advisory and verify before acting; not a substitute for human review._"
            2. For confirmed line-specific issues, use
               `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`,
               prefixing the body with "🤖 AI review (verify): ".
            3. Only post GitHub comments — do not output review text as messages.

          claude_args: >-
            --allowedTools
            "Bash(cat:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"

  # ── Step 3: Post final summary if the PR was batched or capped ──────────────
  final-summary:
    name: Post Final Summary
    needs: [pre-process, review]
    runs-on: ubuntu-latest
    continue-on-error: true   # best-effort; never block the PR (see pre-process)
    if: needs.pre-process.outputs.is_large_pr == 'true' || needs.pre-process.outputs.was_capped == 'true'

    permissions:
      pull-requests: write

    steps:
      - name: Post Large PR Summary
        env:
          GH_TOKEN: ${{ secrets.USER_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          TOTAL_BATCHES: ${{ needs.pre-process.outputs.total_batches }}
          WAS_CAPPED: ${{ needs.pre-process.outputs.was_capped }}
          DROPPED: ${{ needs.pre-process.outputs.dropped_file_count }}
        run: |
          CAP_NOTE=""
          if [ "$WAS_CAPPED" = "true" ]; then
            CAP_NOTE="
          > ⚠️ **This PR exceeded the review size cap.** Only the ${TOTAL_BATCHES} highest-priority batch(es) were reviewed; **${DROPPED} lower-priority file(s) were NOT reviewed.** Split the PR or review the remaining files manually.
          "
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "## 🤖 QTAC Code Review — All Batches Complete

          This was a **large PR** reviewed in **${TOTAL_BATCHES} batches**.
          See the individual batch comments above for detailed findings.
          ${CAP_NOTE}
          > To suppress a false positive: reply to the comment with \`false positive\` or \`NOLINT\`.
          > The learning engine will record it and suppress it in future reviews.
          > To skip review entirely: add \`[skip-review]\` to the PR description.

          > 🤖 _Generated by an AI review agent — findings may be incorrect or incomplete. Treat every comment as advisory and verify before acting; this is not a substitute for human review._"